name: Build desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: siba-attendance-tracker-linux
          - os: windows-latest
            artifact: siba-attendance-tracker-windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-3-0 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r desktop-requirements.txt

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm "packaging/SIBA Attendance Tracker.spec"

      - name: Run tests
        shell: bash
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Package artifact
        shell: bash
        run: |
          mkdir release
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "dist/SIBA Attendance Tracker.exe" "release/SIBA-Attendance-Tracker-windows.exe"
          else
            cp "dist/SIBA Attendance Tracker" "release/SIBA-Attendance-Tracker-linux"
            chmod +x "release/SIBA-Attendance-Tracker-linux"
            tar -czf "release/SIBA-Attendance-Tracker-linux.tar.gz" \
              -C release "SIBA-Attendance-Tracker-linux"

            mkdir -p AppDir/usr/bin AppDir/usr/share/applications
            cp "dist/SIBA Attendance Tracker" AppDir/usr/bin/siba-attendance-tracker
            cp packaging/siba-attendance-tracker.desktop \
              AppDir/usr/share/applications/siba-attendance-tracker.desktop
            cp packaging/siba-attendance-tracker.desktop \
              AppDir/siba-attendance-tracker.desktop
            chmod +x AppDir/usr/bin/siba-attendance-tracker
            wget -q \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
              -O appimagetool
            chmod +x appimagetool
            ARCH=x86_64 ./appimagetool AppDir \
              "release/SIBA-Attendance-Tracker-linux.AppImage"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create source archive
        run: |
          mkdir release
          git archive --format=zip --prefix=SIBA-Attendance-Tracker/ \
            HEAD -o release/SIBA-Attendance-Tracker-source.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: siba-attendance-tracker-source
          path: release/SIBA-Attendance-Tracker-source.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
